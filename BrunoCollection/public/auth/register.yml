info:
  name: /register
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/auth/register
  body:
    type: json
    data: |-
      {
        "name": "Dave Buster",
        "email": "dave@example.com",
        "age": 28,
        "password": "12345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
